name: CI — Lint, Test, Eval, and Frontend

on:
  push:
    branches: [development, testing, main]
  pull_request:
    branches: [development]

jobs:
  # ── Python: lint + offline tests ─────────────────────────────────────────
  lint-and-test:
    name: ruff + offline pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint — ruff check
        run: uv run ruff check .

      - name: Lint — ruff format check
        run: uv run ruff format --check .

      - name: Test — offline pytest
        env:
          LLM_PROVIDER: fake
          VECTOR_STORE: memory
          GRAPH_STORE: memory
          DATABASE_URL: "sqlite:///./data/test.db"
          REDIS_URL: ""
          JWT_SECRET: "ci-test-secret"
          PYTHONPATH: backend
        run: uv run pytest tests/ -v --tb=short --ignore=tests/evaluation --ignore=tests/deployment

  # ── Evaluation gate ───────────────────────────────────────────────────────
  eval-gate:
    name: evaluation metrics gate
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run evaluation suite
        env:
          LLM_PROVIDER: fake
          VECTOR_STORE: memory
          GRAPH_STORE: memory
          DATABASE_URL: "sqlite:///./data/eval.db"
          REDIS_URL: ""
          JWT_SECRET: "ci-eval-secret"
          PYTHONPATH: backend
        run: uv run python -m tests.evaluation.evaluate

  # ── Deployment hygiene ────────────────────────────────────────────────────
  deployment-hygiene:
    name: deployment hygiene tests
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run deployment tests
        env:
          LLM_PROVIDER: fake
          VECTOR_STORE: memory
          GRAPH_STORE: memory
          DATABASE_URL: "sqlite:///./data/test.db"
          REDIS_URL: ""
          JWT_SECRET: "ci-test-secret"
          PYTHONPATH: backend
        run: uv run pytest tests/deployment/ -v --tb=short

  # ── Frontend: lint + Jest tests ───────────────────────────────────────────
  frontend-lint-test:
    name: frontend lint + jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint — ESLint via next lint
        working-directory: frontend
        run: npm run lint

      - name: Test — Jest
        working-directory: frontend
        run: npm run test:ci
